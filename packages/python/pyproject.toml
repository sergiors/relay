[project]
name = "relay-runtime"
version = "0.4.1"
description = "Official Python library and public handler interfaces for Relay applications."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Relay Contributors" }]
keywords = ["relay", "application-development", "handlers"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = []

[project.optional-dependencies]
tracing = ["opentelemetry-api>=1.16,<2"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.11", "opentelemetry-sdk>=1.16,<2", "pytest>=8.3"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
