runtime: python3.14
concurrency: 2

secrets:
  POSTGRES_DSN: postgres-dsn

events:
  - handler: events.created.handler
    pattern:
      recordType: [INSERT]
      collectionName: [users]

  - handler: events.updated.handler
    pattern:
      recordType: [UPDATE]
      collectionName: [users]
    timeout: 20s

  - handler: events.deleted.handler
    pattern:
      recordType: [DELETE]
      collectionName: [users]
