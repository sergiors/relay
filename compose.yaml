services:
  relay:
    build:
      context: .
    container_name: relay
    stop_grace_period: 3m

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      REDIS_URI: redis:6379
      REDIS_STREAM: events
      REDIS_GROUP: relay

      NODE_ID: relay

      DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable

      ROUTING_HOST_OVERRIDE: localhost
      SERVICE_BIND_ADDR: 172.28.0.1
      SERVICE_ADVERTISE_ADDR: 172.28.0.1
      DISCOVERY_ADDR: :8082

      METRICS_ADDR: :9090
      GIT_WEBHOOK_ADDR: :8081

      LOG_LEVEL: DEBUG
      HOT_RELOAD: 1

    volumes:
      - relay-data:/var/lib/relay
      - ./examples/apps:/apps:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - runtime

    healthcheck:
      test: ["CMD", "relay", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s


  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped

    depends_on:
      relay:
        condition: service_healthy

    command:
      - --providers.http.endpoint=http://relay:8082/discovery/traefik
      - --providers.http.pollInterval=5s
      - --providers.http.pollTimeout=5s
      - --entrypoints.web.address=:80

    ports:
      - 80:80

    networks:
      - runtime


  redis:
    image: redis:8-alpine
    container_name: redis

    volumes:
      - redis-data:/data

    networks:
      - runtime

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    container_name: postgres

    environment:
      - POSTGRES_USER=relay
      - POSTGRES_PASSWORD=relay
      - POSTGRES_DB=relay

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - runtime

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


volumes:
  redis-data:
  postgres-data:
  relay-data:


networks:
  runtime:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
