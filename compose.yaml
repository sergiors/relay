services:
  relay:
    image: ghcr.io/sergiors/relay:latest
    container_name: relay
    stop_grace_period: 3m

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      - REDIS_URI=redis:6379
      - REDIS_STREAM=events
      - REDIS_GROUP=relay

      - NODE_ID=relay

      - DATABASE_URL=postgres://relay:relay@postgres:5432/relay?sslmode=disable

      - TRAEFIK_NETWORK=traefik
      - TRAEFIK_HOST_OVERRIDE=localhost

      - METRICS_ADDR=:9090
      - GIT_WEBHOOK_ADDR=:8081

      - LOG_LEVEL=DEBUG

      - HOT_RELOAD=1

    volumes:
      - relay-data:/var/lib/relay
      - ./apps:/apps:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    healthcheck:
      test: ["CMD", "relay", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s


  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped

    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80

    ports:
      - 80:80

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - traefik


  redis:
    image: redis:8-alpine
    container_name: redis

    ports:
      - 6379:6379

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


  postgres:
    image: postgres:17-alpine
    container_name: postgres

    ports:
      - 5432:5432

    environment:
      - POSTGRES_USER=relay
      - POSTGRES_PASSWORD=relay
      - POSTGRES_DB=relay

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  redis-data:
  postgres-data:
  relay-data:


networks:
  traefik:
    name: traefik
