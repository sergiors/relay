name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay?sslmode=disable
      WORKER_ID: relay-ci

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test-unit

      - name: Test (race)
        run: make test-unit-race

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay?sslmode=disable
      WORKER_ID: relay-ci

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Vet (integration tag)
        run: go vet -tags=integration ./...

      - name: Test
        shell: bash
        run: |
          result=0
          make test-integration GOTEST="go test -json" > integration.jsonl 2>&1 || result=$?

          if [ "$result" -ne 0 ]; then
            echo "=== Failed tests/packages ==="
            jq -Rr '
              fromjson?
              | select(.Action == "fail")
              | "\(.Package) :: \(.Test // "(package)")"
            ' integration.jsonl || true

            echo "=== Last 80 log lines ==="
            tail -n 80 integration.jsonl
          fi

          exit "$result"

      - name: Test (race)
        shell: bash
        run: |
          result=0
          make test-integration-race GOTEST="go test -json" > integration-race.jsonl 2>&1 || result=$?

          if [ "$result" -ne 0 ]; then
            echo "=== Failed tests/packages (race) ==="
            jq -Rr '
              fromjson?
              | select(.Action == "fail")
              | "\(.Package) :: \(.Test // "(package)")"
            ' integration-race.jsonl || true

            echo "=== Last 80 log lines ==="
            tail -n 80 integration-race.jsonl
          fi

          exit "$result"

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            integration.jsonl
            integration-race.jsonl
          if-no-files-found: warn
          retention-days: 14