name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-public-types:
    name: Python library checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"

      - name: Sync
        working-directory: packages/python
        run: uv sync --locked

      - name: Type check
        working-directory: packages/python
        run: uv run mypy

      - name: Build
        working-directory: packages/python
        run: uv build

      - name: Test
        working-directory: packages/python
        run: uv run pytest

  node-public-types:
    name: Node.js package checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        run: npm install --global pnpm@12.15.0

      - name: Install
        working-directory: packages/node
        run: pnpm install --frozen-lockfile

      - name: Test package
        working-directory: packages/node
        run: pnpm test

      - name: Verify package contents
        working-directory: packages/node
        run: pnpm pack --dry-run

  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test-unit

      - name: Test (race)
        run: make test-unit-race

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay?sslmode=disable
      NODE_ID: relay-ci

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify integration tools
        run: |
          python3 --version
          git --version

      - name: Vet (integration tag)
        run: go vet -tags=integration ./...

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          make test-integration GOTEST="go test -json" 2>&1 | tee integration-test.log

      - name: Test (race)
        shell: bash
        run: |
          set -o pipefail
          make test-integration-race GOTEST="go test -json" 2>&1 | tee integration-race.log

      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            integration-test.log
            integration-race.log
          if-no-files-found: warn
          retention-days: 3
