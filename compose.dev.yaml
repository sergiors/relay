services:
  redis:
    image: redis:8-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data

  socket-proxy:
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    environment:
      - PING=1
      - VERSION=1
      - BUILD=1
      - CONTAINERS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  relay:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_STREAM=events
      - REDIS_GROUP=relay
      - REDIS_CONSUMER=worker-1
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./functions:/app/functions:ro

volumes:
  redis-data:
